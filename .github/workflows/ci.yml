name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Lint PHP
        run: composer lint:php

      - name: PHPStan
        run: composer stan

      - name: Lint assets
        run: npm run lint

      - name: Build production assets
        run: npm run build
